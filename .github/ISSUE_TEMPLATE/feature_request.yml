name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
