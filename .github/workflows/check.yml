name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          fail=0
          for f in web/y/*.js web/y/lang/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Translations complete
        run: node scripts/i18n-check.mjs --strict

      - name: Python syntax
        run: python3 -m py_compile server/tubehaus_server.py

      - name: Server unit tests
        run: python3 -m unittest discover -s tests -v

      - name: docker compose config
        run: cp .env.example .env && docker compose config --quiet

      - name: Shell scripts
        run: bash -n deploy/entrypoint.sh
